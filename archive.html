    <style>
        :root {
            --fg: #ededed;
            --muted: #8c8c8c;
            --line: #222;
            --sans: 'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --mono: 'Courier Prime', 'Courier New', monospace;
            --pad: clamp(16px, 3vw, 40px);
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100svh;
            background: #000;
            color: var(--fg);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;

        a { color: inherit; }

        .top-nav {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 16px var(--pad);
            padding-top: calc(16px + env(safe-area-inset-top));
            border-bottom: 1px solid var(--line);
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .top-nav a { text-decoration: none; transition: opacity 0.25s; }
        .top-nav a:hover { opacity: 0.5; }
        .top-nav .brand { font-weight: 600; letter-spacing: 0.22em; }
        .top-nav .right { justify-self: end; }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 18px;
            padding: 40px var(--pad);
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(36px, 9vw, 120px);
            font-weight: 200;
            letter-spacing: 0.08em;
            line-height: 1;
        }

        .soon {
            font-family: var(--mono);
            font-size: 13px;
            color: var(--muted);
        }

        .site-footer {
            padding: 0 var(--pad) calc(28px + env(safe-area-inset-bottom));
            text-align: center;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
        }

        @media (max-width: 600px) {
            .top-nav { font-size: 10px; letter-spacing: 0.12em; }
            .top-nav .brand { letter-spacing: 0.14em; }
        }
    </style>
