<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CREDITS | AKW</title>
    <meta name="description" content="CREDITS — AKW THE CREATOR">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AKW THE CREATOR">
    <meta property="og:title" content="CREDITS | AKW">
    <meta property="og:url" content="https://akwthecreator.com/credits.html">
    <meta property="og:image" content="https://akwthecreator.com/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Hanken+Grotesk:wght@200;300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --fg: #ededed;
            --muted: #8c8c8c;
            --dim: #555;
            --line: #222;
            --sans: 'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --mono: 'Courier Prime', 'Courier New', monospace;
            --pad: clamp(16px, 3vw, 40px);
            --nav-h: 48px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            color: var(--fg);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        a { color: inherit; }

        /* ── Навигация (как в DUKEN и ARCHIVE) ── */
        .top-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 16px var(--pad);
            padding-top: calc(16px + env(safe-area-inset-top));
            background: #000;
            border-bottom: 1px solid var(--line);
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .top-nav a { text-decoration: none; transition: opacity 0.25s; }
        .top-nav a:hover { opacity: 0.5; }
        .top-nav .brand { font-weight: 600; letter-spacing: 0.22em; }
        .top-nav .right { justify-self: end; }

        /* ── Сцена титров ── */
        .stage {
            position: fixed;
            top: calc(var(--nav-h) + env(safe-area-inset-top));
            left: 0; right: 0; bottom: 0;
            overflow: hidden;
            cursor: pointer;
            /* Строки плавно появляются снизу и тают сверху */
            -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18%, #000 82%, transparent 100%);
                    mask-image: linear-gradient(to bottom, transparent 0, #000 18%, #000 82%, transparent 100%);
        }

        .roll {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 0 var(--pad);
            text-align: center;
            will-change: transform;
        }

        .block { margin: 0 auto 96px; }

        .block-title {
            margin-bottom: 16px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--dim);
        }

        .block-line {
            font-size: 17px;
            font-weight: 300;
            letter-spacing: 0.2em;
            line-height: 2.1;
            text-transform: uppercase;
        }

        .block.big { margin-bottom: 140px; }

        .block.big .block-line {
            font-size: clamp(30px, 6vw, 76px);
            font-weight: 200;
            letter-spacing: 0.12em;
            line-height: 1.15;
        }

        .end { padding: 40px 0 0; }

        .end img {
            display: block;
            width: 120px;
            margin: 0 auto 28px;
        }

        .end .copy {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.16em;
            color: var(--dim);
        }

        /* ── Пауза ── */
        .pause {
            position: fixed;
            right: var(--pad);
            bottom: calc(20px + env(safe-area-inset-bottom));
            z-index: 10;
            padding: 8px 0;
            background: none;
            border: 0;
            color: var(--dim);
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: color 0.25s;
        }

        .pause:hover { color: var(--fg); }

        /* Кто отключил анимации — обычный список с прокруткой */
        .static .stage { overflow-y: auto; -webkit-mask-image: none; mask-image: none; cursor: default; }
        .static .roll { position: static; padding-top: 80px; padding-bottom: 80px; }
        .static .pause { display: none; }

        @media (max-width: 600px) {
            .top-nav { font-size: 10px; letter-spacing: 0.12em; }
            .top-nav .brand { letter-spacing: 0.14em; }
            .block { margin-bottom: 72px; }
            .block.big { margin-bottom: 110px; }
            .block-line { font-size: 13px; letter-spacing: 0.14em; }
            .block-title { font-size: 10px; }
            .end img { width: 96px; }
        }
    </style>
</head>
<body>

    <nav class="top-nav" id="nav">
        <a href="index.html">← UIGE</a>
        <a href="index.html" class="brand">AKW THE CREATOR</a>
        <a href="duken.html" class="right">DUKEN</a>
    </nav>

    <main class="stage" id="stage">
        <div class="roll" id="roll"></div>
    </main>

    <button class="pause" id="pause" type="button">PAUSE</button>

    <script src="credits.js"></script>
    <script>
    (function () {
        const roll = document.getElementById('roll');
        const stage = document.getElementById('stage');
        const pauseBtn = document.getElementById('pause');
        const nav = document.getElementById('nav');

        const blocks = (typeof CREDITS !== 'undefined' && Array.isArray(CREDITS)) ? CREDITS : [];
        const speed = (typeof CREDITS_SPEED === 'number' && CREDITS_SPEED > 0) ? CREDITS_SPEED : 45;

        // Собираем титры
        blocks.forEach(b => {
            if (!b) return;
            const block = document.createElement('section');
            block.className = 'block' + (b.big ? ' big' : '');
            if (b.title) {
                const t = document.createElement('div');
                t.className = 'block-title';
                t.textContent = b.title;
                block.appendChild(t);
            }
            [].concat(b.lines || []).forEach(line => {
                if (line === '' || line == null) return;
                const l = document.createElement('div');
                l.className = 'block-line';
                l.textContent = line;
                block.appendChild(l);
            });
            roll.appendChild(block);
        });

        const end = document.createElement('section');
        end.className = 'end';
        end.innerHTML = '<img src="AkwLogo4Site.png" alt="AKW"><div class="copy">© 2026 AKWTHECREATOR</div>';
        roll.appendChild(end);

        // Высота навигации — чтобы сцена начиналась ровно под ней
        function setNavH() {
            document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
        }
        setNavH();

        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce || !roll.animate) {
            document.documentElement.classList.add('static');
            return;
        }

        let anim = null;

        function start() {
            setNavH();
            const from = stage.clientHeight;
            const to = -roll.offsetHeight;
            const progress = anim && anim.effect.getComputedTiming().progress;
            const wasPaused = anim && anim.playState === 'paused';
            if (anim) anim.cancel();

            anim = roll.animate(
                [{ transform: `translateY(${from}px)` }, { transform: `translateY(${to}px)` }],
                { duration: (from - to) / speed * 1000, iterations: Infinity, easing: 'linear' }
            );

            if (progress) anim.currentTime = progress * anim.effect.getTiming().duration;
            if (wasPaused) anim.pause();
        }

        function toggle() {
            if (!anim) return;
            if (anim.playState === 'paused') { anim.play(); pauseBtn.textContent = 'PAUSE'; }
            else { anim.pause(); pauseBtn.textContent = 'PLAY'; }
        }

        stage.addEventListener('click', toggle);
        pauseBtn.addEventListener('click', toggle);
        document.addEventListener('keydown', e => {
            if (e.code === 'Space') { e.preventDefault(); toggle(); }
        });

        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(start, 150);
        });

        // Ждём шрифты и логотип, чтобы правильно посчитать высоту
        const logo = end.querySelector('img');
        Promise.all([
            document.fonts ? document.fonts.ready : Promise.resolve(),
            logo.complete ? Promise.resolve() : new Promise(r => { logo.onload = logo.onerror = r; }),
        ]).then(start);
    })();
    </script>

</body>
</html>
