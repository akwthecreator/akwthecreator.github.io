<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DUKEN | AKW</title>
    <meta name="description" content="DUKEN — AKW THE CREATOR">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AKW THE CREATOR">
    <meta property="og:title" content="DUKEN | AKW">
    <meta property="og:description" content="DUKEN — AKW THE CREATOR">
    <meta property="og:url" content="https://akwthecreator.com/duken.html">
    <meta property="og:image" content="https://akwthecreator.com/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Hanken+Grotesk:wght@200;300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000;          /* фон = фон фотографий, поэтому вещи «висят» */
            --fg: #ededed;
            --muted: #8c8c8c;
            --dim: #555;
            --line: #222;
            --sans: 'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --mono: 'Courier Prime', 'Courier New', monospace;
            --pad: clamp(16px, 3vw, 40px);
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; }

        /* ── Верхняя навигация ── */
        .top-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 500;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 16px var(--pad);
            padding-top: calc(16px + env(safe-area-inset-top));
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .top-nav a { text-decoration: none; transition: opacity 0.25s; }
        .top-nav a:hover { opacity: 0.5; }
        .top-nav .brand { font-weight: 600; letter-spacing: 0.22em; }
        .top-nav .right { justify-self: end; }

        /* ── Заголовок страницы ── */
        .shop { max-width: 1440px; margin: 0 auto; overflow: hidden; }

        .page-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            padding: calc(104px + env(safe-area-inset-top)) var(--pad) 22px;
            border-bottom: 1px solid var(--line);
        }

        .page-head h1 {
            margin: 0;
            font-size: clamp(44px, 9vw, 120px);
            font-weight: 200;
            line-height: 0.85;
            letter-spacing: 0.08em;
        }

        .page-head .count {
            font-family: var(--mono);
            font-size: 13px;
            color: var(--muted);
            padding-bottom: 0.3em;
            white-space: nowrap;
        }

        /* ── Сетка товаров: только внутренние линии ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding: 14px 18px 20px;
            border-bottom: 1px solid var(--line);
            border-right: 1px solid var(--line);
        }

        .card:nth-child(3n) { border-right: 0; }

        /* «Уголки» из твоего чертежа — появляются при наведении */
        .card::before, .card::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border: 1px solid var(--fg);
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
        }
        .card::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
        .card::after  { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
        .card:focus-within::before, .card:focus-within::after { opacity: 1; }

        @media (hover: hover) {
            .card:hover::before, .card:hover::after { opacity: 1; }
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--dim);
            text-transform: uppercase;
        }

        .photo {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin: 6px 0 16px;
            padding: 0;
            border: 0;
            background: #000;
            cursor: zoom-in;
            overflow: hidden;
        }

        .photo:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }

        .photo img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.35s ease;
        }

        .photo .alt { opacity: 0; }

        /* На компьютере при наведении показываем вторую сторону */
        @media (hover: hover) {
            .card:hover .photo.alt-ready .main { opacity: 0; }
            .card:hover .photo.alt-ready .alt  { opacity: 1; }
        }

        .name {
            margin: 0;
            font-family: var(--mono);
            font-size: 15px;
            font-weight: 400;
            line-height: 1.3;
        }

        .sizes-label {
            margin-top: 12px;
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--dim);
        }

        .sizes {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            margin-top: 5px;
            font-size: 11px;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .card-foot {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            margin-top: auto;
            padding-top: 20px;
        }

        .price { font-family: var(--mono); font-size: 14px; white-space: nowrap; }
        .price.off { color: var(--dim); font-size: 12px; }

        .alu {
            color: var(--fg);
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
            border-bottom: 1px solid currentColor;
            padding-bottom: 2px;
            transition: opacity 0.3s ease, letter-spacing 0.3s ease;
        }

        .alu:hover { opacity: 0.55; letter-spacing: 0.3em; }

        .shop-msg {
            grid-column: 1 / -1;
            padding: 80px 0;
            text-align: center;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--dim);
        }

        /* ── Футер ── */
        .site-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 24px;
            max-width: 1440px;
            margin: 0 auto;
            padding: 64px var(--pad) calc(28px + env(safe-area-inset-bottom));
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            line-height: 1.6;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
        }

        .site-footer a { text-decoration: none; transition: color 0.25s; }
        .site-footer a:hover { color: var(--fg); }
        .site-footer .right { text-align: right; }

        /* ── Лайтбокс ── */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: grid;
            grid-template-rows: auto 1fr auto;
            background: #000;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
        }

        .lightbox[hidden] { display: none; }

        .lb-top, .lb-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 18px var(--pad);
            font-family: var(--mono);
            font-size: 12px;
            color: var(--muted);
        }

        .lb-label { color: var(--fg); letter-spacing: 0.2em; margin-left: 12px; }

        .lb-close, .lb-nav {
            background: none;
            border: 0;
            color: var(--fg);
            cursor: pointer;
            font-family: var(--sans);
            -webkit-tap-highlight-color: transparent;
            transition: opacity 0.25s;
        }

        .lb-close { font-size: 32px; font-weight: 200; line-height: 1; padding: 0 4px; }
        .lb-close:hover, .lb-nav:hover { opacity: 0.5; }

        .lb-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
            touch-action: pan-y;
        }

        .lb-frame { position: relative; display: block; }

        .lb-frame::before, .lb-frame::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border: 1px solid var(--fg);
            pointer-events: none;
        }
        .lb-frame::before { top: -5px; left: -5px; border-right: 0; border-bottom: 0; }
        .lb-frame::after  { bottom: -5px; right: -5px; border-left: 0; border-top: 0; }

        .lb-frame img {
            display: block;
            max-width: min(88vw, 1100px);
            max-height: calc(100vh - 150px);
            max-height: calc(100svh - 150px);
            user-select: none;
            -webkit-user-drag: none;
        }

        .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 56px;
            height: 56px;
            font-size: 26px;
            font-weight: 200;
            z-index: 2;
        }

        .lb-prev { left: calc(var(--pad) - 16px); }
        .lb-next { right: calc(var(--pad) - 16px); }
        .lb-nav[hidden] { display: none; }

        .lb-name { color: var(--fg); }
        .lb-bottom .alu { font-family: var(--sans); }

        /* ── Телефоны ── */
        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .card:nth-child(3n) { border-right: 1px solid var(--line); }
            .card:nth-child(2n) { border-right: 0; }
            .card { padding: 10px 12px 16px; }
            .name { font-size: 13px; }
            .price { font-size: 13px; }
            .price.off { font-size: 10px; }
            .alu { font-size: 10px; letter-spacing: 0.16em; }
        }

        @media (max-width: 600px) {
            .top-nav { font-size: 10px; letter-spacing: 0.12em; padding-top: calc(14px + env(safe-area-inset-top)); padding-bottom: 14px; }
            .top-nav .brand { letter-spacing: 0.14em; }
            .page-head { padding-top: calc(88px + env(safe-area-inset-top)); }
            .sizes { font-size: 10px; gap: 3px 9px; }
            .sizes-label { font-size: 9px; }
            .card-foot { flex-wrap: wrap; row-gap: 10px; }
            .lb-frame img { max-width: 100vw; }
            .lb-frame::before, .lb-frame::after { display: none; }
            .lb-nav { width: 48px; height: 48px; }
            .lb-prev { left: 4px; }
            .lb-next { right: 4px; }
            .site-footer { flex-direction: column; align-items: flex-start; }
            .site-footer .right { text-align: left; }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="index.html">← UIGE</a>
        <a href="index.html" class="brand">AKW THE CREATOR</a>
        <a href="archive.html" class="right">ARCHIVE</a>
    </nav>

    <main class="shop">
        <header class="page-head">
            <h1>DUKEN</h1>
            <div class="count" id="count"></div>
        </header>

        <div class="grid" id="grid"></div>
    </main>

    <footer class="site-footer">
        <div>AKW THE CREATOR<br>DUKEN</div>
        <div class="right">
            <a href="https://www.instagram.com/021akw/" target="_blank" rel="noopener">Instagram ↗</a><br>
            © 2026 AKWTHECREATOR. All rights reserved.
        </div>
    </footer>

    <!-- Лайтбокс -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto" hidden>
        <div class="lb-top">
            <span><span id="lb-count">01 / 02</span><span class="lb-label" id="lb-label">ALDY</span></span>
            <button class="lb-close" id="lb-close" type="button" aria-label="Jabu">&times;</button>
        </div>
        <div class="lb-stage" id="lb-stage">
            <button class="lb-nav lb-prev" id="lb-prev" type="button" aria-label="Artqa">&#10229;</button>
            <span class="lb-frame"><img id="lb-img" alt=""></span>
            <button class="lb-nav lb-next" id="lb-next" type="button" aria-label="Alǵa">&#10230;</button>
        </div>
        <div class="lb-bottom">
            <span class="lb-name" id="lb-name"></span>
            <span><span id="lb-price"></span>&nbsp;&nbsp;&nbsp;<a class="alu" id="lb-alu" href="#" target="_blank" rel="noopener">ALU</a></span>
        </div>
    </div>

    <script src="products.js"></script>
    <script>
    (function () {
        const IG_DM = 'https://ig.me/m/021akw';
        const grid = document.getElementById('grid');

        if (typeof PRODUCTS === 'undefined' || !Array.isArray(PRODUCTS)) {
            grid.innerHTML = '<div class="shop-msg">products.js ERROR</div>';
            return;
        }

        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        const pad = n => String(n).padStart(2, '0');

        const formatPrice = p => typeof p === 'number'
            ? String(p).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' KZT'
            : String(p || '');

        // Фото товара: [то, что видно в сетке, вторая сторона]
        function photosOf(p) {
            const list = [{ src: p.front, label: 'ALDY' }];
            if (p.back && p.back !== p.front) list.push({ src: p.back, label: 'ARTY' });
            if (p.cover === 'back' && list.length > 1) list.reverse();
            return list;
        }

        const items = PRODUCTS.map(p => {
            const off = p.available === false;
            return {
                name: p.name || '',
                color: p.color || '',
                sizes: String(p.sizes || '').split(/[\s,]+/).filter(Boolean),
                photos: photosOf(p),
                priceText: off ? 'NOT AVAILABLE' : formatPrice(p.price),
                off: off,
                link: off ? IG_DM : (p.link || IG_DM),
            };
        });

        document.getElementById('count').textContent = '(' + pad(items.length) + ')';

        if (!items.length) {
            grid.innerHTML = '<div class="shop-msg">—</div>';
            return;
        }

        grid.innerHTML = items.map((it, i) => {
            const fullName = it.name + (it.color ? ' — ' + it.color : '');
            const alt = it.photos[1]
                ? `<img class="alt" data-src="${esc(it.photos[1].src)}" alt="" width="1000" height="1000" decoding="async">`
                : '';
            const sizes = it.sizes.length
                ? `<div class="sizes-label">Qol jetimdi kólemder</div>
                   <div class="sizes">${it.sizes.map(s => `<span>${esc(s)}</span>`).join('')}</div>`
                : '';
            return `
            <article class="card">
                <div class="card-top"><span>${pad(i + 1)}</span><span>${esc(it.color)}</span></div>
                <button class="photo" type="button" data-index="${i}" aria-label="${esc(fullName)}">
                    <img class="main" src="${esc(it.photos[0].src)}" alt="${esc(fullName)}"
                         width="1000" height="1000" decoding="async" loading="${i < 3 ? 'eager' : 'lazy'}">
                    ${alt}
                </button>
                <h2 class="name">${esc(it.name)}</h2>
                ${sizes}
                <div class="card-foot">
                    <span class="price${it.off ? ' off' : ''}">${esc(it.priceText)}</span>
                    <a class="alu" href="${esc(it.link)}" target="_blank" rel="noopener">ALU</a>
                </div>
            </article>`;
        }).join('');

        // Вторую сторону грузим только когда мышь наведена (экономия трафика)
        grid.querySelectorAll('.photo').forEach(btn => {
            const altImg = btn.querySelector('.alt');
            if (!altImg) return;
            btn.closest('.card').addEventListener('pointerenter', e => {
                if (e.pointerType !== 'mouse' || altImg.src) return;
                altImg.addEventListener('load', () => btn.classList.add('alt-ready'), { once: true });
                altImg.src = altImg.dataset.src;
            });
        });

        // ── Лайтбокс ──
        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lb-img');
        const lbCount = document.getElementById('lb-count');
        const lbLabel = document.getElementById('lb-label');
        const lbName = document.getElementById('lb-name');
        const lbPrice = document.getElementById('lb-price');
        const lbAlu = document.getElementById('lb-alu');
        const prevBtn = document.getElementById('lb-prev');
        const nextBtn = document.getElementById('lb-next');
        let current = null;
        let idx = 0;
        let lastFocus = null;

        function show() {
            const ph = current.photos[idx];
            lbImg.src = ph.src;
            lbImg.alt = current.name + ' — ' + ph.label;
            lbCount.textContent = pad(idx + 1) + ' / ' + pad(current.photos.length);
            lbLabel.textContent = ph.label;
        }

        function open(i) {
            current = items[i];
            idx = 0;
            const many = current.photos.length > 1;
            prevBtn.hidden = !many;
            nextBtn.hidden = !many;
            lbName.textContent = current.name + (current.color ? ' — ' + current.color : '');
            lbPrice.textContent = current.priceText;
            lbAlu.href = current.link;
            show();
            lastFocus = document.activeElement;
            lb.hidden = false;
            document.documentElement.style.overflow = 'hidden';
            document.getElementById('lb-close').focus({ preventScroll: true });
        }

        function close() {
            lb.hidden = true;
            lbImg.removeAttribute('src');
            document.documentElement.style.overflow = '';
            if (lastFocus) lastFocus.focus({ preventScroll: true });
        }

        function step(d) {
            if (!current || current.photos.length < 2) return;
            idx = (idx + d + current.photos.length) % current.photos.length;
            show();
        }

        grid.addEventListener('click', e => {
            const btn = e.target.closest('.photo');
            if (btn) open(Number(btn.dataset.index));
        });

        prevBtn.addEventListener('click', e => { e.stopPropagation(); step(-1); });
        nextBtn.addEventListener('click', e => { e.stopPropagation(); step(1); });
        document.getElementById('lb-close').addEventListener('click', close);

        // Клик по пустому месту закрывает
        document.getElementById('lb-stage').addEventListener('click', e => {
            if (e.target === e.currentTarget) close();
        });

        document.addEventListener('keydown', e => {
            if (lb.hidden) return;
            if (e.key === 'Escape') close();
            else if (e.key === 'ArrowLeft') step(-1);
            else if (e.key === 'ArrowRight') step(1);
        });

        // Свайп на телефоне
        let startX = null, startY = null;
        lb.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });
        lb.addEventListener('touchend', e => {
            if (startX === null) return;
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
            startX = startY = null;
        }, { passive: true });
    })();
    </script>

</body>
